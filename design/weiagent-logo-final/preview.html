<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeiAgent Final Logo</title>
    <style>
      :root {
        font-family: Inter, "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        color: #17201c;
        background: #edf1ef;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 1100px;
        margin: 0;
      }

      body {
        padding: 56px 64px;
        background:
          linear-gradient(#dfe5e1 1px, transparent 1px),
          linear-gradient(90deg, #dfe5e1 1px, transparent 1px),
          #edf1ef;
        background-size: 32px 32px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 105px;
        border-bottom: 1px solid #cbd4cf;
        padding-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 50px;
        line-height: 1;
      }

      header p {
        margin: 0 0 4px;
        color: #56635c;
        font-size: 18px;
      }

      .accent {
        color: #07c160;
      }

      main {
        display: grid;
        grid-template-columns: 650px minmax(0, 1fr);
        gap: 30px;
        margin-top: 30px;
      }

      .hero,
      .detail {
        border: 1px solid #d7ded9;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 28px rgba(23, 32, 28, 0.06);
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 760px;
      }

      .hero > img {
        width: 500px;
        height: 500px;
      }

      .size-test {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        height: 96px;
        margin-top: 34px;
      }

      .size-test img {
        display: block;
      }

      .detail {
        display: grid;
        grid-template-rows: 320px 1fr;
        min-height: 760px;
        overflow: hidden;
      }

      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #e1e7e3;
        padding: 40px;
      }

      .lockup img {
        width: 690px;
        height: auto;
      }

      .spec {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 34px;
        padding: 46px;
      }

      h2 {
        margin: 0 0 20px;
        font-size: 30px;
      }

      .spec p {
        max-width: 480px;
        margin: 0;
        color: #56635c;
        font-size: 18px;
        line-height: 1.8;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 28px;
      }

      .tags span {
        border: 1px solid #cdd7d1;
        border-radius: 999px;
        padding: 8px 12px;
        background: #f6f9f7;
        font-size: 14px;
        font-weight: 650;
      }

      .mono {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-left: 1px solid #e1e7e3;
      }

      .mono img {
        width: 170px;
        height: 170px;
      }

      .mono span {
        margin-top: 16px;
        color: #738078;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 26px;
        color: #738078;
        font-size: 14px;
      }

      .palette {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .swatch {
        width: 24px;
        height: 24px;
        border: 1px solid rgba(23, 32, 28, 0.14);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wei<span class="accent">Agent</span> Final Mark</h1>
      <p>Centered call core · connected AI agents · balanced at every size</p>
    </header>

    <main>
      <section class="hero">
        <img src="./weiagent-app-icon.svg" alt="WeiAgent final app icon" />
        <div class="size-test">
          <img src="./weiagent-app-icon.svg" width="24" height="24" alt="" />
          <img src="./weiagent-app-icon.svg" width="36" height="36" alt="" />
          <img src="./weiagent-app-icon.svg" width="52" height="52" alt="" />
          <img src="./weiagent-app-icon.svg" width="72" height="72" alt="" />
          <img src="./weiagent-app-icon.svg" width="96" height="96" alt="" />
        </div>
      </section>

      <section class="detail">
        <div class="lockup">
          <img src="./weiagent-logo-horizontal.svg" alt="WeiAgent horizontal logo" />
        </div>
        <div class="spec">
          <div>
            <h2>AI 通信，由多个 Agent 共同完成</h2>
            <p>左右镜像气泡代表不同通信端点，中央白色气泡是共享通话通道；三个 Agent 节点连接到 AI 核心，再汇入居中的电话听筒。整体沿同一条中轴构建，视觉重量更稳定。</p>
            <div class="tags">
              <span>AI communication</span>
              <span>Multi-agent</span>
              <span>Voice &amp; chat</span>
              <span>Centered</span>
            </div>
          </div>
          <div class="mono">
            <img src="./weiagent-mark-monochrome.svg" alt="WeiAgent monochrome mark" />
            <span>One-ink version</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>Final vector system · July 2026</span>
      <div class="palette">
        <span>Palette</span>
        <span class="swatch" style="background:#07c160"></span>
        <span class="swatch" style="background:#00a9a5"></span>
        <span class="swatch" style="background:#063a36"></span>
        <span class="swatch" style="background:#17201c"></span>
        <span class="swatch" style="background:#ffffff"></span>
      </div>
    </footer>
  </body>
</html>
