[package]
name = "WeiAgent"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdf-extract = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2", "gzip", "deflate", "system-proxy", "socks"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
scraper = "0.23"
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["json", "gzip", "deflate", "brotli", "zstd", "socks", "system-proxy", "webpki-roots", "tokio-rt"] }
wreq-util = "3.0.0-rc.14"
rust-embed = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dashmap = "6"
dom_smoothie = "0.18"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
